# Prevent unauthenticated menu editing (e) and command-line access (c).
# No password is configured, so authentication is impossible and these keys
# are effectively disabled.  The production entry below is --unrestricted so
# it boots without credentials.
set superusers="kiosk"

# Boot straight into the kiosk: no menu, no countdown, no theme, no beep.
# The live-build generated grub.cfg sources this file before its own
# (credential-locked) entries, so default=0 is always the entry below.
# Keeping the firmware framebuffer (gfxpayload=keep) lets the Plymouth
# splash take over without a mode switch.
set default=0
set timeout_style=hidden
set timeout=0
set gfxpayload=keep

# Direct boot entry that uses the kernel symlinks always created by live-build.
# The symlinks /live/vmlinuz and /live/initrd.img point to the versioned files
# and are safe to use because the ISO filesystem carries Rock Ridge / POSIX
# symlink support.  The command line matches BOOTAPPEND_LIVE in
# live-build/auto/config.
menuentry "Sushi-da OS (amd64)" --unrestricted --hotkey=l {
	set gfxpayload=keep
	linux	/live/vmlinuz boot=live components quiet splash loglevel=3 rd.udev.log_level=3 udev.log_level=3 systemd.show_status=false rd.systemd.show_status=false vt.global_cursor_default=0 plymouth.ignore-serial-consoles plymouth.use-simpledrm console=tty0 console=ttyS0,115200n8
	initrd	/live/initrd.img
}
