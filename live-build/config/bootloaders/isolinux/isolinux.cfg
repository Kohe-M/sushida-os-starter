# Security: prevent boot parameter editing at the ISOLINUX prompt level.
# These directives are also read by EXTLINUX when the same image boots from a
# USB drive.
ALLOWOPTIONS 0
NOESCAPE 1
# Boot straight into the kiosk: no menu UI (vesamenu/splash) and no prompt.
# Without a UI module and with PROMPT 0, the DEFAULT label boots at once;
# TIMEOUT stays non-zero because "TIMEOUT 0" would mean "wait forever"
# should a prompt ever be enabled.
PROMPT 0
TIMEOUT 1
DEFAULT sushi-da-os
include live.cfg
