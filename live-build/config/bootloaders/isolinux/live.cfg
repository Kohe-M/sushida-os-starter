label sushi-da-os
	menu label Sushi-da OS (amd64)
	linux /live/vmlinuz
	append boot=live components quiet splash loglevel=3 rd.udev.log_level=3 udev.log_level=3 systemd.show_status=false rd.systemd.show_status=false vt.global_cursor_default=0 plymouth.ignore-serial-consoles plymouth.use-simpledrm console=tty0 console=ttyS0,115200n8
	initrd /live/initrd.img
