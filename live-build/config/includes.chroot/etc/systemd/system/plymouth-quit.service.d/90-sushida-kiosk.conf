# Plymouth -> Cage handoff.  Keep the boot splash up while the kiosk
# launcher waits for the network and selects its route, then quit Plymouth
# keeping its last frame, so the screen goes from the splash straight to
# Cage with no text console in between.  The handoff helper is bounded and
# its failure is ignored ("-"), so Plymouth always quits.
[Service]
ExecStartPre=-/usr/local/libexec/sushida-splash-handoff
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
TimeoutSec=150
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
