name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned by commit SHA (tags are mutable); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (node24)
        with:
          # The job never pushes; keep the token out of the .git/config that
          # is bind-mounted into the builder container.
          persist-credentials: false
      - name: Build builder image
        run: docker build -t sushida-os-builder:trixie -f builder/Dockerfile .
      - name: Run make ci (static tests + shell tests + git diff)
        run: docker run --rm -v "$PWD:/sushida-os" -w /sushida-os sushida-os-builder:trixie make ci
